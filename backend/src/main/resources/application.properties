spring.application.name=backend

# Sample/demo data (criteria, self-assessments, default HR accounts, sample PIPs). Off by default.
epms.autoseed.enabled=false

spring.datasource.url=jdbc:mysql://localhost:3306/epms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT HS256: secret must be >= 256 bits (32 bytes). Hex string below is 64 hex chars = 32 bytes.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
spring.jackson.date-format=dd/MM/yyyy
spring.jackson.time-zone=UTC

# Gmail: use an App Password (16 chars, no spaces in MAIL_PASSWORD). Do not commit real credentials.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:howardwolowits963@gmail.com}
spring.mail.password=bepr tyjk zemi wvhu
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.profiles.active=local

# Local overrides (JWT, DB password): copy application-local.properties.example to
# src/main/resources/application-local.properties (see backend/.gitignore).