spring.application.name=backend

# Sample/demo data (criteria, self-assessments, default HR accounts, sample PIPs). Off by default.
epms.autoseed.enabled=false

spring.datasource.url=jdbc:mysql://localhost:3306/epms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Aligns schema with mapped entities only; does not drop tables whose entities were removed.
# Legacy self_assessment / self_assessment_answer / self_assessment_question are dropped at startup
# by LegacySelfAssessmentTablesDropInitializer (Hibernate ddl-auto cannot remove orphaned tables).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# JWT HS256: secret must be >= 256 bits (32 bytes). Override via JWT_SECRET or application-local.properties.
jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
spring.jackson.date-format=dd/MM/yyyy
spring.jackson.time-zone=UTC

# Gmail: use an App Password (16 chars, no spaces in MAIL_PASSWORD). Do not commit real credentials.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:abcdefg@gmail.com}
spring.mail.password=xxxx xxxx xxxx xxxx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.profiles.active=local

# Profile pictures/signatures persist under user home so branch switches and run-dir changes do not break files.
# Example on Windows: C:/Users/<you>/epms-uploads/...
epms.upload.profile-pictures-dir=${user.home}/uploads/profile-pictures
epms.upload.signatures-dir=${user.home}/uploads/signatures
epms.reports.template-path=classpath:reports/
epms.reports.output-dir=${user.home}/epms-reports
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Local overrides (JWT, DB password): copy application-local.properties.example to
# src/main/resources/application-local.properties (see backend/.gitignore).
